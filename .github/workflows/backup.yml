# NOTE: this workflow has never completed a run — the `production` GitHub
# environment has no secrets configured, and even with secrets set,
# GitHub-hosted runners cannot reach the deployment host's LAN address
# without an additional Tailscale (or similar) step, which does not exist
# here. Scheduled database backup + restore verification now runs directly
# on the deployment host via a systemd timer — see scripts/systemd/. The
# scheduled trigger below is disabled so this doesn't show up as a
# permanently-failing daily run; workflow_dispatch is kept for a future
# Tailscale-enabled version of this workflow.
name: Verify production backup

on:
  # schedule:
  #   - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload database maintenance scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: scripts/backup_database.sh,scripts/verify_database_backup.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Upload monitoring configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: monitoring/prometheus.yml,monitoring/alerts.yml,monitoring/alertmanager.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Upload monitoring configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: monitoring/prometheus.yml,monitoring/alerts.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Create and verify backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            mkdir -p monitoring
            chmod 700 scripts/backup_database.sh scripts/verify_database_backup.sh
            backup_file="$(ENV_FILE=.env.production COMPOSE_FILE=docker-compose.prod.yml scripts/backup_database.sh)"
            test -s "$backup_file"
            ENV_FILE=.env.production COMPOSE_FILE=docker-compose.prod.yml scripts/verify_database_backup.sh "$backup_file"
            find backups -type f -name 'scrobbler-*.dump' -mtime -1 -print -quit | grep -q .
            printf 'backup=%s\nsize_bytes=%s\n' "$backup_file" "$(wc -c < "$backup_file")"

      - name: Write backup summary
        if: success()
        run: |
          {
            echo "### Production backup verification"
            echo "- Backup created and restore-verified successfully"
            echo "- Retention cleanup completed on the deployment host"
          } >> "$GITHUB_STEP_SUMMARY"