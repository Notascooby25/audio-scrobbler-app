# NOTE: break-glass only. This workflow has never completed a run — the
# `production` GitHub environment has no secrets configured, and even with
# secrets set, GitHub-hosted runners cannot reach the deployment host's LAN
# address without an additional Tailscale (or similar) step, which does not
# exist here. The live delivery path is Watchtower polling GHCR's `:latest`
# tag directly from the host (see the `watchtower` service in
# docker-compose.prod.yml) — no GitHub-initiated deploy is required for a
# normal release. Keep this workflow only for a deliberate pinned
# rollback/rollforward once host reachability is solved.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR tag to deploy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload production Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Upload database maintenance scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: scripts/backup_database.sh,scripts/verify_database_backup.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Upload monitoring configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: monitoring/prometheus.yml,monitoring/alerts.yml,monitoring/alertmanager.yml,monitoring/alertmanager-entrypoint.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy immutable image tag
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_OWNER,GHCR_USERNAME,GHCR_TOKEN
          script_stop: false
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            mkdir -p monitoring
            chmod 700 scripts/backup_database.sh scripts/verify_database_backup.sh
            backup_file="$(ENV_FILE=.env.production COMPOSE_FILE=docker-compose.prod.yml scripts/backup_database.sh)"
            ENV_FILE=.env.production COMPOSE_FILE=docker-compose.prod.yml scripts/verify_database_backup.sh "$backup_file"
            previous_tag="$(cat .deployed-image-tag 2>/dev/null || sed -n 's/^IMAGE_TAG=//p' .env.production | head -n 1 || true)"
            printf '%s\n' "$previous_tag" > .previous-image-tag
            printf '%s\n' "$IMAGE_TAG" > .requested-image-tag
            rollback() {
              echo "Deployment failed; attempting rollback" >&2
              GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml --env-file .env.production logs --no-color || true
              if [ -n "$previous_tag" ]; then
                GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$previous_tag" docker compose -f docker-compose.prod.yml --env-file .env.production pull || true
                GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$previous_tag" docker compose -f docker-compose.prod.yml --env-file .env.production up -d || true
              fi
            }
            trap rollback EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml --env-file .env.production pull
            GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            # Poll container health rather than curling host ports: backend
            # and frontend are the only services that publish one at all
            # (worker, prometheus, alertmanager, node-exporter never did),
            # and even backend's port is host-configurable via
            # BACKEND_HOST_PORT, so a hardcoded "localhost:8000" silently
            # stops meaning anything the moment that changes. All 8 services
            # in docker-compose.prod.yml carry a healthcheck; this is the
            # same "count healthy containers" pattern ci.yml's own
            # production-monitoring-smoke job already uses successfully.
            for attempt in $(seq 1 30); do
              healthy="$(docker compose -f docker-compose.prod.yml --env-file .env.production ps --format json | grep -c '"Health":"healthy"' || true)"
              if [ "$healthy" -ge 8 ]; then
                printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
                trap - EXIT
                exit 0
              fi
              sleep 5
            done
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            exit 1

      - name: Verify monitoring deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            # prometheus/alertmanager publish no host ports, so this has to
            # run from inside the containers — a curl against
            # "localhost:9090" on the host would have hit whatever else is
            # already listening there (Cockpit, on this NUC), silently
            # checking the wrong service entirely. Matches the pattern
            # ci.yml's production-monitoring-smoke job already uses.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T prometheus wget --spider --quiet http://localhost:9090/-/ready
            targets="$(docker compose -f docker-compose.prod.yml --env-file .env.production exec -T prometheus wget -qO- http://localhost:9090/api/v1/targets)"
            printf '%s' "$targets" | grep -q '"job":"backend".*"health":"up"'
            printf '%s' "$targets" | grep -q '"job":"worker".*"health":"up"'
            printf '%s' "$targets" | grep -q '"job":"backup".*"health":"up"'
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T prometheus wget -qO- http://localhost:9090/api/v1/rules | grep -q 'AudioScrobbler'
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T alertmanager wget --spider --quiet http://localhost:9093/-/ready

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "### Production deployment"
            echo "- Image tag: \`${{ inputs.image_tag }}\`"
            echo "- Target: \`${{ secrets.DEPLOY_HOST }}\`"
            echo "- Database backup and restore verification: passed"
            echo "- Backend, worker, and frontend health checks passed"
          } >> "$GITHUB_STEP_SUMMARY"