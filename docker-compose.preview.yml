# A private copy of the app on the owner's PC, for trying a branch before it
# goes live. Started by scripts/preview.sh, never by hand. Built from the
# production Dockerfiles, with no background jobs, monitoring or auto-updater.
#
# The backend sits on an internal-only network, so it cannot reach Spotify or
# anything else outside, and its token key differs from live, so stored Spotify
# connections cannot be decrypted. Only the frontend publishes a port.
name: audio-scrobbler-preview

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
    networks:
      - preview_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview -d preview"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://preview:${POSTGRES_PASSWORD}@db:5432/preview
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY}
      WORKER_INGESTION_TOKEN: ${WORKER_INGESTION_TOKEN}
      SPOTIFY_CLIENT_ID: preview-disabled
      SPOTIFY_CLIENT_SECRET: preview-disabled
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - preview_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # nginx.conf names Docker's DNS address; use whichever this PC's containers have.
    command:
      - sh
      - -c
      - >-
        sed -i "s/127.0.0.11/$$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf)/"
        /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports:
      - "${PREVIEW_BIND:-127.0.0.1}:15173:5173"
    volumes:
      - ${PREVIEW_DATA_DIR}/preview-login.html:/usr/share/nginx/html/preview-login.html:ro,Z
    networks:
      - preview_internal
      - preview_edge
    depends_on:
      backend:
        condition: service_healthy

volumes:
  preview_postgres_data:

networks:
  preview_internal:
    internal: true
  preview_edge:
