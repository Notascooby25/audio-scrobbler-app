server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same path prefixes vite.config.js proxies for the dev server — kept in
    # sync so the built app talks to the backend identically in both modes.
    # VITE_API_BASE_URL is expected to stay unset in production (relative
    # requests), so these are what actually route API traffic.
    #
    # /library and /reports are split into their own block below: those two
    # prefixes collide with real SPA page routes (GET /library, GET /reports),
    # which have no bare backend route and would otherwise 404 instead of
    # falling through to try_files. Every other prefix here is API-only, so a
    # bare prefix match is safe.
    location ~ ^/(import|auth|analytics|stats|spotify|users|preferences|blocks|artwork|health|readyz) {
        # Docker's embedded DNS (127.0.0.11) resolves "backend" to whichever
        # container currently holds that service name. nginx normally
        # resolves upstream hostnames once at startup and caches forever;
        # with watchtower able to recreate backend independently of
        # frontend, a stale cached IP would silently break every API call
        # until frontend itself happened to restart. The resolver + variable
        # combination forces re-resolution instead of a permanent cache.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /library and /reports only route to the backend when a sub-path follows
    # (e.g. /library/scrobbles, /reports/summary) — the backend has no bare
    # GET /library or GET /reports route. A bare request for either falls
    # through to the SPA location below instead.
    location ~ ^/(library|reports)/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (dist/assets/*) are safe to cache aggressively —
    # their filenames change whenever their contents do.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the service worker must always be revalidated, or a
    # deployed update won't reach clients that already have this PWA
    # installed/cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # SPA client-side routing: anything not matched above falls back to
    # index.html rather than a static 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
