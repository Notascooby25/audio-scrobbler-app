services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER}/audio-scrobbler-app-backend:${IMAGE_TAG}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=audio-scrobbler-app
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      # Cosmetic only — set to a commit SHA in .env.production if you want
      # /readyz to report something other than "latest". Deliberately not
      # tied to IMAGE_TAG: with watchtower as the delivery path, IMAGE_TAG is
      # pinned to the literal string "latest", which is meaningless as a
      # reported version. The authoritative record of what's actually
      # running is `docker inspect` against the image digest, not this value.
      APP_VERSION: ${APP_VERSION:-latest}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY}
      WORKER_INGESTION_TOKEN: ${WORKER_INGESTION_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES:-user-read-recently-played user-library-read user-read-currently-playing}
      FRONTEND_AUTH_CALLBACK_URL: ${FRONTEND_AUTH_CALLBACK_URL}
      ALLOWED_SPOTIFY_USER_IDS: ${ALLOWED_SPOTIFY_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/${GHCR_OWNER}/audio-scrobbler-app-worker:${IMAGE_TAG}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=audio-scrobbler-app
    environment:
      WORKER_BACKEND_URL: http://backend:8000
      WORKER_INGESTION_TOKEN: ${WORKER_INGESTION_TOKEN}
      WORKER_FIXTURE_ENABLED: "false"
      WORKER_SPOTIFY_ENABLED: ${WORKER_SPOTIFY_ENABLED:-true}
      WORKER_SPOTIFY_INTERVAL_MINUTES: ${WORKER_SPOTIFY_INTERVAL_MINUTES:-1}
      WORKER_LIKED_TRACKS_INTERVAL_MINUTES: ${WORKER_LIKED_TRACKS_INTERVAL_MINUTES:-30}
      WORKER_PLAYLIST_CACHE_INTERVAL_MINUTES: ${WORKER_PLAYLIST_CACHE_INTERVAL_MINUTES:-15}
      WORKER_PLAYLIST_CACHE_BATCH_SIZE: ${WORKER_PLAYLIST_CACHE_BATCH_SIZE:-10}
      WORKER_FILE_IMPORT_ENABLED: ${WORKER_FILE_IMPORT_ENABLED:-false}
      WORKER_IMPORT_DIR: /data/imports
      WORKER_FILE_IMPORT_INTERVAL_MINUTES: ${WORKER_FILE_IMPORT_INTERVAL_MINUTES:-10}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    # To enable worker file-based import, mount a host directory at /data/imports and set WORKER_FILE_IMPORT_ENABLED=true:
    # volumes:
    #   - ${WORKER_IMPORT_HOST_DIR}:/data/imports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Built from frontend/Dockerfile.prod (a static nginx build, not the
  # Vite dev server frontend/Dockerfile runs for local dev) — see that
  # file for why. BACKEND_PROXY_URL and VITE_ALLOWED_HOSTS were dev-server
  # config and no longer apply; nginx.conf proxies API paths to backend:8000
  # directly. VITE_API_BASE_URL is intentionally not set here either: it's
  # a build-time value baked into the static bundle by `vite build`, so a
  # runtime compose var can't affect it post-build — leaving it unset keeps
  # the frontend on same-origin relative requests through nginx's proxy.
  frontend:
    image: ghcr.io/${GHCR_OWNER}/audio-scrobbler-app-frontend:${IMAGE_TAG}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=audio-scrobbler-app
    ports:
      - "5173:5173"
    healthcheck:
      # 127.0.0.1, not localhost: this custom nginx.conf only listens
      # on IPv4 (nginx's stock IPv6-listen auto-injection skips any
      # conf.d file it does not recognize as its packaged default,
      # logged as "differs from the packaged version"), but busybox
      # wget resolves "localhost" to ::1 first inside this image and
      # gets connection-refused there. This healthcheck failed
      # permanently despite the app serving traffic completely
      # normally over IPv4 (verified: external curls all succeeded
      # while this reported unhealthy).
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    environment:
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://127.0.0.1:65535/disabled}
      ALERTMANAGER_WARNING_WEBHOOK_URL: ${ALERTMANAGER_WARNING_WEBHOOK_URL:-http://127.0.0.1:65535/disabled}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager-entrypoint.sh:/alertmanager-entrypoint.sh:ro
    entrypoint: ["sh", "/alertmanager-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    volumes:
      - ./monitoring:/host-monitoring:ro
    command:
      - --collector.textfile.directory=/host-monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The sole delivery path from GitHub to this host: polls GHCR for new
  # :latest images and auto-updates backend/worker/frontend (only containers
  # labeled com.centurylinklabs.watchtower.enable=true — db and the
  # monitoring stack are deliberately excluded). IMAGE_TAG must stay
  # "latest" for this to do anything — pinning it to an immutable sha-<...>
  # tag makes watchtower a permanent no-op, since it only re-resolves the
  # tag a container was originally started with. Needs the host
  # already logged in via `docker login ghcr.io` so DOCKER_CONFIG_DIR/
  # config.json carries GHCR credentials through for pulling private images.
  #
  # WATCHTOWER_SCOPE matters on any host that already runs another watchtower
  # instance for a different app: on startup, an *unscoped* watchtower stops
  # every other watchtower container it finds, scoped or not — only a scoped
  # instance limits itself to same-scope peers. Any sibling watchtower on a
  # shared host must be at least set to scope "none" (not left fully unset)
  # for the two to coexist safely; see containrrr.dev/watchtower docs on
  # running multiple instances.
  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Required rather than defaulted: unset, this resolved to
      # "/config.json" on the host, silently mounting the wrong thing and
      # leaving watchtower unauthenticated against GHCR. There is no safe
      # default to guess here (~ does not expand in compose volume paths),
      # so fail loudly at `compose config` time instead.
      - ${DOCKER_CONFIG_DIR:?set DOCKER_CONFIG_DIR to the docker config dir holding your GHCR login, e.g. /home/youruser/.docker}/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_SCOPE: audio-scrobbler-app
      # Without this, watchtower's bundled Docker client negotiates down to
      # a very old API version that modern Docker daemons reject outright
      # ("client version 1.25 is too old"). Matches the working pin used by
      # this NUC's other watchtower-based deployments.
      DOCKER_API_VERSION: ${WATCHTOWER_DOCKER_API_VERSION:-1.41}

volumes:
  postgres_data:
  prometheus_data: