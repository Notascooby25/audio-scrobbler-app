global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 10s
    - matchers: [severity="warning"]
      receiver: warning

receivers:
  - name: default
  - name: critical
    webhook_configs:
      - url: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL}
        send_resolved: true
  - name: warning
    webhook_configs:
      - url: ${ALERTMANAGER_WARNING_WEBHOOK_URL}
        send_resolved: true
