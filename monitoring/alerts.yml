groups:
  - name: audio-scrobbler
    rules:
      - alert: AudioScrobblerBackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend metrics target is unavailable

      - alert: AudioScrobblerWorkerDown
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Worker metrics target is unavailable

      - alert: AudioScrobblerSchedulerStopped
        expr: audio_scrobbler_worker_scheduler_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Worker scheduler is not running

      - alert: AudioScrobblerSpotifySyncFailures
        expr: audio_scrobbler_worker_spotify_sync_failures > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Spotify sync failures detected

      - alert: AudioScrobblerNoRecentSpotifySync
        expr: audio_scrobbler_worker_spotify_sync_success == 0 and audio_scrobbler_worker_spotify_sync_users > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Spotify sync has not completed successfully

      - alert: AudioScrobblerBackupStale
        expr: time() - audio_scrobbler_backup_last_verified_timestamp_seconds > 43200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Production database backup verification is stale

      - alert: AudioScrobblerBackupNeverRan
        expr: absent(audio_scrobbler_backup_last_verified_timestamp_seconds)
        for: 7h
        labels:
          severity: critical
        annotations:
          summary: No database backup has ever been verified on this host

      - alert: AudioScrobblerOffsiteBackupStale
        expr: time() - audio_scrobbler_backup_last_offsite_timestamp_seconds > 43200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Offsite (Google Drive) backup upload is stale

      - alert: AudioScrobblerOffsiteBackupNeverRan
        expr: absent(audio_scrobbler_backup_last_offsite_timestamp_seconds)
        for: 7h
        labels:
          severity: warning
        annotations:
          summary: No offsite backup upload has ever succeeded on this host
