version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrobbler}
      POSTGRES_USER: ${POSTGRES_USER:-scrobbler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrobbler}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrobbler -d scrobbler"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_VERSION: 0.2.4
      ACCESS_TOKEN_TTL_SECONDS: 3600
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_REDIRECT_URI: http://localhost:8000/auth/spotify/callback
      SPOTIFY_SCOPES: user-read-recently-played
      FRONTEND_AUTH_CALLBACK_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      DEV_USER_ID: 1
      DEV_USER_SPOTIFY_ID: development-user
      DEV_USER_DISPLAY_NAME: Development User
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scrobbler}:${POSTGRES_PASSWORD:-scrobbler}@db:5432/${POSTGRES_DB:-scrobbler}
      WORKER_INGESTION_TOKEN: ${WORKER_INGESTION_TOKEN:-dev-worker-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    ports:
      - "8001:8001"
    environment:
      WORKER_BACKEND_URL: http://backend:8000
      WORKER_INGESTION_TOKEN: ${WORKER_INGESTION_TOKEN:-dev-worker-token}
      WORKER_FIXTURE_ENABLED: "false"
      WORKER_USER_ID: "1"
      WORKER_SPOTIFY_ENABLED: "false"
      WORKER_SPOTIFY_INTERVAL_MINUTES: "5"
      WORKER_FILE_IMPORT_ENABLED: "false"
      WORKER_IMPORT_DIR: /data/imports
      WORKER_FILE_IMPORT_INTERVAL_MINUTES: "10"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scrobbler}:${POSTGRES_PASSWORD:-scrobbler}@db:5432/${POSTGRES_DB:-scrobbler}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:-0123456789abcdef0123456789abcdef}
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
    # To enable worker file-based import, mount a host directory at /data/imports and set WORKER_FILE_IMPORT_ENABLED=true:
    # volumes:
    #   - ./worker-imports:/data/imports
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
