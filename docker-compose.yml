version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scrobbler
      POSTGRES_USER: scrobbler
      POSTGRES_PASSWORD: scrobbler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrobbler -d scrobbler"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.2
      DATABASE_URL: postgresql+psycopg://scrobbler:scrobbler@db:5432/scrobbler
      WORKER_INGESTION_TOKEN: dev-worker-token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    ports:
      - "8001:8001"
    environment:
      WORKER_BACKEND_URL: http://backend:8000
      WORKER_INGESTION_TOKEN: dev-worker-token
      WORKER_FIXTURE_ENABLED: "false"
      WORKER_USER_ID: "1"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
